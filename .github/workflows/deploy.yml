name: Deploy GitHub Pages
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Test realtime relay
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm run relay:dev > /tmp/meeting-relay.log 2>&1 &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID" || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/meeting-relay.log; exit 1; fi
          set +e
          npm test > /tmp/meeting-tests.log 2>&1
          TEST_STATUS=$?
          set -e
          cat /tmp/meeting-tests.log
          if [ "$TEST_STATUS" -ne 0 ]; then
            python3 -c 'from pathlib import Path; text=Path("/tmp/meeting-tests.log").read_text()[-5000:]; print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$TEST_STATUS"
      - run: npm run build
        env:
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL || 'https://meeting-dynamics-relay.kkodama-lab.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
